# =============================================================================
# recibo-claro — reglas de negocio versionadas
# -----------------------------------------------------------------------------
# Este archivo es la ÚNICA fuente de parámetros de negocio. El motor determinístico
# no tiene constantes de negocio en el código: todo lo que un analista de facturación
# podría discutir vive aquí y viaja en `rules_version` dentro de cada respuesta.
#
# Etiquetas: [CONFIRMADO-OFICIAL] cita de las bases/ficha · [SUPUESTO] · [PROPUESTA]
#            · [POR VALIDAR] pendiente de confirmar con el equipo de facturación.
# =============================================================================
rules_version: "1.0.0"
descripcion: >-
  Reglas simplificadas de facturación B2C para la explicación de recibos.
  Valores de referencia del MVP; los marcados [POR VALIDAR] deben confirmarse con
  el equipo de facturación de Movistar antes de cualquier uso real.

# -----------------------------------------------------------------------------
# Política de cálculo
# -----------------------------------------------------------------------------
politica:
  # [POR VALIDAR] Si es false, los días en suspensión no se cobran y generan un
  # ajuste negativo. Si es true, la renta corre igual durante la suspensión.
  cobro_en_suspension: false
  # [CONFIRMADO-OFICIAL] "actual" usa los días reales del ciclo (28/29/30/31);
  # "30_360" fuerza meses de 30 días.
  #
  # Resuelto con el material de formación oficial del Desafío 1 (vídeo «Alta y
  # porta», 01:39): «Tu plan es de 60 soles al mes. Al activar el beneficio antes
  # del cierre del ciclo se cobrará solo la porción de los días consumidos:
  # PRORRATEO, que serán 3 días a 6 soles.»
  #
  #   S/60 ÷ 30 días = S/2/día  →  3 días = S/6
  #
  # Con la convención "actual" y un ciclo de 31 días, esos mismos 3 días darían
  # S/5,81 y el recibo no cuadraría con el del operador. Movistar prorratea sobre
  # base 30 con independencia de los días naturales del mes.
  # Entre comillas a propósito: sin ellas, YAML lee `30_360` como el ENTERO 30360
  # (el guion bajo es separador de millares) y la convención se pierde en silencio.
  convencion_prorrateo: "30_360"
  dias_base_30_360: 30
  # Invariante de conciliación: por encima de esto NO se explica, se deriva.
  tolerancia_residual_cent: 1
  # IGV peruano en puntos básicos (18,00 %).
  igv_bp: 1800
  # Reparto del residuo de redondeo entre líneas.
  metodo_redondeo: mayor_resto
  # El cargo de reconexión es fijo y se cobra una sola vez en el ciclo. [SUPUESTO]
  cargo_reconexion_cent: 2500
  # Las cuotas de equipo financiado NUNCA se prorratean.
  prorratear_financiamiento: false
  # Días de gracia antes de suspender por deuda. [SUPUESTO]
  dias_gracia_suspension: 15

  # [CONFIRMADO-OFICIAL] El descuento por alta nueva o portabilidad se aplica
  # SOLO sobre el cargo fijo del plan. Vídeo oficial «Alta y porta», 04:06:
  # «Ten en cuenta, este descuento para ambos casos sólo aplica sobre el cargo
  # fijo del plan del cliente, que es de 60 soles, y NO sobre los servicios
  # adicionales como SVAs, paquetes, financiamiento de equipos entre otros.»
  #
  # Un motor que reparta el descuento sobre todas las líneas produce cifras que
  # no coinciden con el recibo real. No es una preferencia de diseño: es la regla.
  descuento_alta_solo_cargo_fijo: true

  # [CONFIRMADO-OFICIAL] La promoción de alta/portabilidad se mide en DÍAS, no en
  # meses naturales. Vídeo «Alta y porta», 02:02 y 02:25: «el descuento es por 90
  # días aproximadamente al 50 %… si le restamos los días del beneficio del recibo
  # 1 (3 días), 2 (30 días) y 3 (30 días), son 63 días, por lo que quedan solo 27
  # días de descuento».
  #
  # De ahí que el recibo 4 sea MIXTO: parte con descuento y parte sin él. Un motor
  # que cuente meses da un cuarto recibo entero sin descuento, y se equivoca.
  ventana_descuento_alta_dias: 90

# -----------------------------------------------------------------------------
# Ciclos de facturación
# -----------------------------------------------------------------------------
# [CONFIRMADO-OFICIAL] El ciclo nombra el día de CIERRE; la facturación reanuda al
# día siguiente. Vídeo «Planta», 01:33: «en el ciclo 5, su inicio de facturación es
# el 6 de cada mes y su fin es el 5… su fecha de vencimiento será el 21 de cada mes».
#
# La tabla ciclo → día de vencimiento NO se dedujo del vídeo: se extrajo de los
# 297 002 cargos del dataset del desafío, donde cada ciclo tiene un único día de
# vencimiento observado. El ciclo 5 → día 21 coincide exactamente con el vídeo, lo
# que valida las otras ocho filas.
ciclos:
  vencimiento_por_ciclo:
    5: 21
    9: 25
    12: 24
    15: 1
    17: 5
    20: 3
    23: 9
    27: 13
    31: 17
  # El recibo se envía unos 10 días antes del vencimiento («Planta», 01:39).
  dias_aviso_antes_de_vencer: 10

# -----------------------------------------------------------------------------
# Confianza de la atribución de causa (sección 4.7)
# -----------------------------------------------------------------------------
confianza:
  causa_unica: 0.98
  sin_candidato: 0.30
  multiples_candidatos: 0.65
  tope_prorrateo_inconsistente: 0.50
  tolerancia_prorrateo_cent: 1
  minima_para_explicar: 0.35
  # Causa fijada por `preferencia_causa` sin ninguna orden del CRM que la respalde.
  # Alta (la regla de concepto es determinista) pero por debajo de `causa_unica`:
  # una causa deducida del concepto no vale lo mismo que una causa documentada.
  regla_concepto: 0.90

# -----------------------------------------------------------------------------
# Umbrales del score de incomprensión (sección 4.8)
# U = 1 - (w1*s1 + w2*s2 + w3*(1-s3) + w6*(1-s6));  DERIVAR si U > tau_alto
#
# QUÉ MIDE w1, Y QUÉ NO
# ---------------------
# `s1` mide el DESGLOSE: qué parte del delta total está repartida en líneas con nombre
# comercial, importe anterior, importe actual y evidencia citable. Responde a «¿sé
# cuánto varió y en qué líneas?», que es lo que hace falta para poder explicar.
#
# NO mide la CONFIRMACIÓN CAUSAL —qué parte tiene detrás una orden del CRM—, que se
# calcula aparte como `cobertura_causal` y queda FUERA de U. El dataset del desafío no
# trae órdenes de CRM: mezclarlas imponía un suelo permanente de 0.40 al score y
# convertía el hand-off en el caso normal en recibos que se explican al céntimo. La
# laguna causal se dice en voz alta en la narrativa y ofrece un asesor; no lo impone.
#
# El caso de verdad inexplicable —el recibo que no cuadra— tiene su propia vía y es una
# regla dura: INVARIANTE_ROTO. No necesita que s1 lo cubra.
# -----------------------------------------------------------------------------
umbrales_incomprension:
  tau_alto: 0.65
  tau_bajo: 0.35
  pesos:
    w1: 0.40 # cobertura del delta DESGLOSADO por línea (no "atribuido a una causa")
    w2: 0.25 # unicidad de causa
    w3: 0.20 # repregunta
    w6: 0.15 # turnos sin progreso
  similitud_repregunta: 0.80
  max_turnos_sin_progreso: 2
  histeresis: true # una vez derivado, no se vuelve atrás
  # ...pero solo mientras haya una persona atendiendo. Una derivación que nadie recogió
  # no es una conversación humana que proteger, y fijarla condenaba el diálogo entero
  # por un único turno de fricción.
  histeresis_requiere_asesor: true
  reglas_duras:
    - PETICION_HUMANO
    - INVARIANTE_ROTO
    - CONCEPTO_FUERA_CATALOGO
    - INTENCION_REGULATORIA
  intenciones_regulatorias:
    - reclamo formal
    - libro de reclamaciones
    - osiptel
    - indecopi
    - dar de baja
    - portabilidad
    - cancelar el servicio

# -----------------------------------------------------------------------------
# Cross-selling restrictivo (literal de la ficha): doble condición
# -----------------------------------------------------------------------------
cross_selling:
  habilitado: true
  requiere_consulta_resuelta: true
  requiere_regla_explicita: true
  confianza_minima: 0.90
  prohibido_si_derivacion: true
  prohibido_si_delta_negativo: false
  reglas_explicitas:
    - id: MT_SI_TIENE_MOVIL_Y_HOGAR
      descripcion: Cliente con móvil y hogar por separado; Movistar Total le ahorraría.
      requiere_causas: []
      requiere_conceptos: [RENTA_PLAN_MOVIL, RENTA_HOGAR_INTERNET]
    - id: PAQUETE_DATOS_RECURRENTE
      descripcion: Compró paquetes de datos en 3 ciclos seguidos; un plan mayor le conviene.
      requiere_causas: [ALTA_PAQUETE]
      requiere_conceptos: [PAQUETE_DATOS_ADICIONAL]

# -----------------------------------------------------------------------------
# Efecto efervescente: beneficios que el cliente YA tiene y se recuerdan al cerrar,
# SIN presentarlos como adiciones nuevas (literal de la ficha).
# -----------------------------------------------------------------------------
efecto_efervescente:
  habilitado: true
  maximo_beneficios: 2
  frase_apertura: "Recuerde que su plan ya incluye"

# -----------------------------------------------------------------------------
# Tabla regla_concepto_causa: qué movimientos pueden explicar cada concepto.
# Fuente única: el catálogo hereda de aquí su campo `causas_permitidas`.
# -----------------------------------------------------------------------------
regla_concepto_causa:
  RENTA_PLAN_MOVIL: [CAMBIO_PLAN, ALTA_SERVICIO, BAJA_SERVICIO, SUSPENSION]
  RENTA_HOGAR_INTERNET: [CAMBIO_PLAN, ALTA_SERVICIO, BAJA_SERVICIO, SUSPENSION]
  RENTA_TV: [CAMBIO_PLAN, ALTA_SERVICIO, BAJA_SERVICIO, SUSPENSION]
  RENTA_LINEA_FIJA: [CAMBIO_PLAN, ALTA_SERVICIO, BAJA_SERVICIO, SUSPENSION]
  # SUSPENSION va al final, igual que en las demás rentas: si en el mismo ciclo hubo
  # cambio de plan y suspensión, manda el cambio de plan. Faltaba aquí y solo aquí, y
  # el efecto era una mentira: la renta convergente de un cliente al que le cortaron el
  # servicio se quedaba sin causa del CRM y heredaba la causa oficial del catálogo
  # (CAMBIO_DE_PLAN), de modo que el recibo le decía «cambio de plan: -S/ 49.01» a quien
  # nunca cambió de plan. Lo destapó la ampliación de la suite golden: son 5 cuentas de
  # 300 (Movistar Total + CORTE_RECONEXION) y ninguna caía en los 34 casos originales.
  RENTA_MOVISTAR_TOTAL: [CAMBIO_PLAN, ALTA_SERVICIO, BAJA_SERVICIO, SUSPENSION]
  PRORRATEO_PLAN: [CAMBIO_PLAN, ALTA_SERVICIO, BAJA_SERVICIO]
  AJUSTE_RETROACTIVO_RENTA: [CAMBIO_PLAN]
  AJUSTE_DIAS_SUSPENSION: [SUSPENSION, AJUSTE_SUSPENSION]
  CARGO_RECONEXION: [RECONEXION]
  CUOTA_EQUIPO_FINANCIADO: [ALTA_EQUIPO_FINANCIADO]
  INTERES_FINANCIAMIENTO: [ALTA_EQUIPO_FINANCIADO]
  PAQUETE_DATOS_ADICIONAL: [ALTA_PAQUETE]
  PAQUETE_ROAMING: [ALTA_PAQUETE]
  PAQUETE_TV_PREMIUM: [ALTA_PAQUETE, ALTA_SERVICIO, BAJA_SERVICIO]
  SERVICIO_ADICIONAL_SEGURO: [ALTA_PAQUETE, ALTA_SERVICIO, BAJA_SERVICIO]
  ALQUILER_EQUIPO_HOGAR: [ALTA_SERVICIO, BAJA_SERVICIO]
  INSTALACION_HOGAR: [ALTA_SERVICIO]
  CARGO_TRASLADO: [ALTA_SERVICIO]
  DESCUENTO_PROMOCIONAL: [FIN_DESCUENTO, CAMBIO_PLAN]
  DESCUENTO_MOVISTAR_TOTAL: [FIN_DESCUENTO, CAMBIO_PLAN]
  DESCUENTO_EQUIPO: [FIN_DESCUENTO]
  NOTA_CREDITO: [NOTA_CREDITO]
  NOTA_DEBITO: [NOTA_DEBITO]
  LLAMADAS_FUERA_DE_PLAN: []
  SMS_PREMIUM: []
  LARGA_DISTANCIA: []
  CONSUMO_DATOS_ADICIONAL: []
  INTERES_MORATORIO: []
  DEUDA_ANTERIOR: []
  IGV: []
  REDONDEO: []

# -----------------------------------------------------------------------------
# Preferencia de causa por REGLA DE CONCEPTO.
#
# `regla_concepto_causa` dice qué movimientos PUEDEN explicar un concepto; esta tabla
# dice cuál de ellos DEBE ganar cuando la variación es de una clase determinada, aunque
# el CRM no haya emitido esa orden y aunque haya otro movimiento más cercano en el
# tiempo. Es el arreglo del defecto de atribución causal:
#
#   Un cambio de plan cancela una promoción atada al plan anterior. En la ventana del
#   ciclo solo hay un CAMBIO_PLAN, así que la atribución por movimiento etiquetaba la
#   desaparición del descuento como "cambio de plan" y el cliente leía que su recibo
#   subió por haber cambiado de plan, cuando el cambio de plan por sí solo se lo BAJÓ.
#   Un descuento que se encoge o desaparece es, por definición del concepto, una
#   promoción que terminó: FIN_DESCUENTO.
#
# Formato: concepto_id -> {ClaseDelta: TipoMovimiento}. Las clases son las de
# `LineaDelta.clasificar`; para una línea de crédito (importe negativo), SUBIO significa
# que el crédito se encogió y DESAPARECIDO que dejó de aplicarse. La causa preferida
# debe estar en `regla_concepto_causa` del mismo concepto: si no, la carga aborta.
# -----------------------------------------------------------------------------
preferencia_causa:
  DESCUENTO_PROMOCIONAL:
    DESAPARECIDO: FIN_DESCUENTO
    SUBIO: FIN_DESCUENTO
  DESCUENTO_MOVISTAR_TOTAL:
    DESAPARECIDO: FIN_DESCUENTO
    SUBIO: FIN_DESCUENTO
  DESCUENTO_EQUIPO:
    DESAPARECIDO: FIN_DESCUENTO
    SUBIO: FIN_DESCUENTO

# -----------------------------------------------------------------------------
# Catálogo base de conceptos (31 entradas).
# `definicion_cliente` es lo que puede llegar al cliente: sin tecnicismos, de usted
# y SIN CIFRAS (las cifras solo salen del FactSet).
# -----------------------------------------------------------------------------
catalogo:
  - concepto_id: RENTA_PLAN_MOVIL
    nombre_comercial: Plan móvil
    nombre_tecnico: RENTA MENSUAL MOVIL
    familia: RECURRENTE
    prorrateable: true
    afecto_igv: true
    causa_oficial: CAMBIO_DE_PLAN
    definicion_cliente: >-
      Es el cobro mensual de su plan móvil. Cubre lo que su plan incluye:
      minutos, mensajes y datos.
    definicion_tecnica: Renta recurrente del plan móvil, prorrateable por días de vigencia.
    sinonimos: [plan, renta, mensualidad, cargo fijo, plan celular]
    ejemplo_variacion: Si cambió de plan a mitad de mes, verá esta renta partida en dos periodos.

  - concepto_id: RENTA_HOGAR_INTERNET
    nombre_comercial: Internet hogar
    nombre_tecnico: RENTA MENSUAL BANDA ANCHA
    familia: RECURRENTE
    prorrateable: true
    afecto_igv: true
    causa_oficial: CAMBIO_DE_PLAN
    definicion_cliente: Es el cobro mensual de su servicio de internet en casa.
    definicion_tecnica: Renta recurrente de banda ancha fija, prorrateable.
    sinonimos: [internet, wifi, banda ancha, fibra]
    ejemplo_variacion: Sube si mejoró la velocidad contratada a mitad de ciclo.

  - concepto_id: RENTA_TV
    nombre_comercial: Televisión
    nombre_tecnico: RENTA MENSUAL TV
    familia: RECURRENTE
    prorrateable: true
    afecto_igv: true
    causa_oficial: CAMBIO_DE_PLAN
    definicion_cliente: Es el cobro mensual de su servicio de televisión.
    definicion_tecnica: Renta recurrente de TV, prorrateable.
    sinonimos: [cable, tv, televisión]
    ejemplo_variacion: Cambia si sumó o quitó paquetes de canales.

  - concepto_id: RENTA_LINEA_FIJA
    nombre_comercial: Teléfono fijo
    nombre_tecnico: RENTA MENSUAL TELEFONIA FIJA
    familia: RECURRENTE
    prorrateable: true
    afecto_igv: true
    causa_oficial: CAMBIO_DE_PLAN
    definicion_cliente: Es el cobro mensual de su línea de teléfono fijo.
    definicion_tecnica: Renta recurrente de telefonía fija, prorrateable.
    sinonimos: [línea fija, teléfono de casa]
    ejemplo_variacion: Puede variar si su paquete de minutos cambió.

  - concepto_id: RENTA_MOVISTAR_TOTAL
    nombre_comercial: Movistar Total
    nombre_tecnico: RENTA PAQUETE CONVERGENTE MT
    familia: RECURRENTE
    prorrateable: true
    afecto_igv: true
    causa_oficial: CAMBIO_DE_PLAN
    definicion_cliente: >-
      Es el cobro mensual de su paquete Movistar Total, que reúne sus servicios
      móviles y de hogar en un solo plan.
    definicion_tecnica: Renta convergente MT, sustituye a las rentas individuales.
    sinonimos: [movistar total, paquete completo, MT]
    ejemplo_variacion: Aparece cuando sus servicios se unifican en un solo plan.

  - concepto_id: PRORRATEO_PLAN
    nombre_comercial: Ajuste por días
    nombre_tecnico: PRORRATEO RENTA
    familia: AJUSTE
    prorrateable: true
    afecto_igv: true
    causa_oficial: PRORRATEOS
    definicion_cliente: >-
      Es el cobro proporcional a los días que estuvo vigente cada plan dentro del
      mes. Se usa cuando un cambio no ocurre justo el primer día del ciclo.
    definicion_tecnica: Prorrateo de renta por tramos de vigencia dentro del ciclo.
    sinonimos: [prorrateo, proporcional, días, cobro parcial]
    ejemplo_variacion: Si cambió de plan a mitad de mes, se cobra una parte de cada plan.

  - concepto_id: AJUSTE_RETROACTIVO_RENTA
    nombre_comercial: Ajuste del mes anterior
    nombre_tecnico: AJUSTE RETROACTIVO RENTA ADELANTADA
    familia: AJUSTE
    prorrateable: true
    afecto_igv: true
    causa_oficial: PRORRATEOS
    definicion_cliente: >-
      Su plan se cobra por adelantado. Cuando algo cambia a mitad del mes ya
      cobrado, este ajuste corrige la diferencia en el recibo siguiente.
    definicion_tecnica: >-
      Corrección (P_new - P_old) * d_new / D del ciclo anterior en modalidad de renta
      adelantada. Convive con la renta anticipada del ciclo siguiente.
    sinonimos: [ajuste, retroactivo, regularización, diferencia]
    ejemplo_variacion: >-
      Con renta adelantada, un cambio de plan hace convivir dos rentas en el mismo
      recibo, por lo que el total puede subir aunque el plan nuevo sea más barato.

  - concepto_id: AJUSTE_DIAS_SUSPENSION
    nombre_comercial: Ajuste por días sin servicio
    nombre_tecnico: AJUSTE POR SUSPENSION
    familia: AJUSTE
    prorrateable: true
    afecto_igv: true
    causa_oficial: AJUSTES_POR_DIAS_DE_SUSPENSION
    definicion_cliente: >-
      Es la devolución proporcional por los días en que su servicio estuvo
      suspendido y usted no pudo usarlo.
    definicion_tecnica: Ajuste negativo por tramos con estado SUSPENDIDO no facturables.
    sinonimos: [descuento por suspensión, días sin servicio, corte]
    ejemplo_variacion: Aparece en el recibo posterior a un periodo de suspensión.

  - concepto_id: CARGO_RECONEXION
    nombre_comercial: Reconexión del servicio
    nombre_tecnico: CARGO POR RECONEXION
    familia: UNICO
    prorrateable: false
    afecto_igv: true
    causa_oficial: RECONEXIONES
    definicion_cliente: >-
      Es el cobro único por volver a activar su servicio después de una suspensión.
      Se cobra una sola vez, en el recibo del mes en que se reactivó.
    definicion_tecnica: Cargo fijo no prorrateable asociado a un movimiento de reconexión.
    sinonimos: [reconexión, reactivación, volver a activar]
    ejemplo_variacion: Aparece solo en el ciclo en que se reconectó el servicio.

  - concepto_id: CUOTA_EQUIPO_FINANCIADO
    nombre_comercial: Cuota de su equipo
