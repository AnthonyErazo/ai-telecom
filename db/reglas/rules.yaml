    sinonimos: [cuota, equipo, celular en cuotas, financiamiento]
    ejemplo_variacion: Deja de aparecer cuando termina de pagar todas las cuotas.

  - concepto_id: INTERES_FINANCIAMIENTO
    nombre_comercial: Interés del financiamiento
    nombre_tecnico: INTERES CUOTA EQUIPO
    familia: FINANCIAMIENTO
    prorrateable: false
    afecto_igv: false
    causa_oficial: EQUIPO_FINANCIADO
    definicion_cliente: Es la parte de intereses incluida en la cuota de su equipo.
    definicion_tecnica: Componente de interés de la cuota francesa del periodo.
    sinonimos: [intereses, financiamiento]
