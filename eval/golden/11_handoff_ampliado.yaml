    Hand-off por regla dura PETICION_HUMANO. El recibo es explicable y concilia al
    céntimo, pero la frase del cliente obliga a pasar la conversación a una persona: la
    regla dura gana sobre cualquier score de incomprensión. El payload de derivación
    tiene que llegar completo, con el resumen para el asesor y la referencia de la
    traza.
