# Casos POSITIVOS de hand-off: aquí el sistema DEBE derivar a un asesor humano.
#
# La ficha define la Precisión del Hand-off como "exactitud lógica al decidir cuándo
# derivar a un humano basándose en umbrales de incomprensión". Los tres casos disparan
# reglas duras distintas de `facts_engine.confianza`, que derivan sin calcular el score:
#
#   PETICION_HUMANO        el cliente pide explícitamente un asesor
#   INTENCION_REGULATORIA  reclamo formal / Osiptel / Indecopi / libro de reclamaciones
#   INTENCION_REGULATORIA  baja del servicio o portabilidad
#
# El error asimétrico importa: el falso negativo (no derivar cuando había que derivar)
# es el daño grave, por eso Recall_handoff es la métrica primaria.

- caso_id: G29_handoff_peticion_humano
  descripcion: >-
    El recibo es explicable y el motor concilia, pero el cliente pide un asesor. La
    petición explícita gana sobre cualquier score: se deriva con el contexto cargado.
  seed: 20260804
  cuenta_id: C-00017
  periodo: "2026-07"
  verbosidad: CORTO
  canal: APP
  nivel: LOA2
  utterance: "no me convence su explicación, quiero hablar con un asesor por favor"
  modalidad_renta: ADELANTADA
  escenarios: [CAMBIO_PLAN_MEDIO_CICLO]
  causas_esperadas: [CAMBIO_PLAN]
  causas_oficiales_esperadas: [CAMBIO_DE_PLAN]
