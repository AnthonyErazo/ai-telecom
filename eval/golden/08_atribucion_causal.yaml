  periodo: "2026-07"
  verbosidad: DETALLE
  canal: APP
  nivel: LOA2
  utterance: "me cambié de plan y el recibo subió, ¿por qué?"
  modalidad_renta: VENCIDA
  escenarios: [CAMBIO_PLAN_MEDIO_CICLO]
  causas_esperadas: [FIN_DESCUENTO, CAMBIO_PLAN]
  causas_oficiales_esperadas: [PROMOCIONES_VENCIDAS, CAMBIO_DE_PLAN]
  conceptos_esperados:
    - DESCUENTO_PROMOCIONAL
    - RENTA_PLAN_MOVIL
    - IGV
  delta_esperado_cent: 7678
