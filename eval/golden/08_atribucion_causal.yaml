- caso_id: G37_cambio_plan_sin_promocion_adelantada
  descripcion: >-
    CASO INVERSO, el que impide que la corrección se pase de frenada. Cambio de plan en
    renta adelantada SIN promoción que perder: no hay ninguna línea de descuento, así que
    la regla de concepto no debe dispararse, la causa tiene que seguir siendo el cambio
    de plan y el texto no puede hablar de ninguna promoción terminada. Si alguien
    "arreglara" la atribución convirtiendo todo aumento en un fin de descuento, este caso
    lo detecta.
  seed: 20260804
