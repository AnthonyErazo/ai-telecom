  escenarios: [CAMBIO_PLAN_MEDIO_CICLO]
  causas_esperadas: [CAMBIO_PLAN]
  causas_oficiales_esperadas: [CAMBIO_DE_PLAN]
  conceptos_esperados:
    - RENTA_PLAN_MOVIL
    - AJUSTE_RETROACTIVO_RENTA
    - IGV
  delta_esperado_cent: 3198
