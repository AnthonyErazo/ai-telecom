# GRUPO DE CONTROL: recibos que NO variaron (Δ = 0).
#
# Son el contraejemplo que impide que el sistema apruebe la evaluación "explicando"
# siempre algo. Con delta cero el motor no tiene ninguna línea que explicar, y la
# respuesta correcta es decir que el recibo se mantuvo igual — sin inventar una causa,
# sin sugerir que subió y sin derivar a un asesor.
#
# `no_debe_contener` recoge aquí el vocabulario de variación: si aparece, el sistema
# está narrando un cambio que no existe.

